<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="who-am-ai: let your AI know how you like things done">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18181b"/>
      <stop offset="1" stop-color="#27272a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a3e635" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3e635"/>
    </marker>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <circle cx="930" cy="180" r="230" fill="url(#glow)"/>

  <!-- chat bubbles: what you say -->
  <g fill="#3f3f46">
    <rect x="610" y="82" width="170" height="40" rx="14"/>
    <rect x="640" y="146" width="150" height="40" rx="14"/>
    <rect x="600" y="210" width="180" height="40" rx="14"/>
    <rect x="630" y="274" width="140" height="40" rx="14"/>
  </g>
  <g fill="#a1a1aa">
    <rect x="626" y="98" width="110" height="8" rx="4"/>
    <rect x="656" y="162" width="92" height="8" rx="4"/>
    <rect x="616" y="226" width="120" height="8" rx="4"/>
    <rect x="646" y="290" width="84" height="8" rx="4"/>
  </g>

  <path d="M806 198 H866" stroke="#a3e635" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- the profile: what the AI loads -->
  <rect x="890" y="62" width="260" height="256" rx="16" fill="#18181b" stroke="#a3e635" stroke-width="2.5"/>
  <text x="914" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#a3e635">me.md</text>
  <g fill="#a3e635">
    <circle cx="918" cy="138" r="5"/>
    <circle cx="918" cy="174" r="5"/>
    <circle cx="918" cy="210" r="5"/>
    <circle cx="918" cy="246" r="5"/>
    <circle cx="918" cy="282" r="5"/>
  </g>
  <g fill="#d4d4d8">
    <rect x="934" y="134" width="170" height="8" rx="4"/>
    <rect x="934" y="170" width="140" height="8" rx="4"/>
    <rect x="934" y="206" width="180" height="8" rx="4"/>
    <rect x="934" y="242" width="120" height="8" rx="4"/>
    <rect x="934" y="278" width="156" height="8" rx="4"/>
  </g>

  <!-- text -->
  <text x="70" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="78" font-weight="700" fill="#fafafa">who-am-<tspan fill="#a3e635">ai</tspan></text>
  <text x="74" y="220" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="22" fill="#a3e635">Let your AI know how you like things done</text>
  <text x="74" y="264" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="18" fill="#a1a1aa">A short profile, learned from your own messages,</text>
  <text x="74" y="290" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="18" fill="#a1a1aa">that your AI assistants load in every conversation.</text>
</svg>
